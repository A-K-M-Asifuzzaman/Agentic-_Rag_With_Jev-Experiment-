[project]
name = "agentic-rag-jev"
version = "0.1.0"
description = "LangGraph agentic RAG where Jev makes the cheap structured routing decisions and an LLM handles generation and low-confidence escalation."
authors = [
    { name = "Asif Zman", email = "138548302+asif4762@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "tavily-python>=0.8.4",
    "typesafe-sdk>=0.7.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ajev = "app.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/eval.py" = ["ASYNC240"]  # batch runner; small local file IO between graph runs

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
